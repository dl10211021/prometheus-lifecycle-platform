name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - name: Verify committed vendor tree
        run: test -f vendor/modules.txt
      - name: Unit tests
        run: make unit
      - name: Go vet
        run: make vet
      - name: Build
        run: make build
      - name: Localhost smoke and product closure
        env:
          BASE: http://127.0.0.1:18080
        run: make test-local
      - name: Remote deployment lifecycle
        env:
          BASE: ${{ vars.REMOTE_PLATFORM_BASE }}
          REMOTE_USER: ${{ vars.REMOTE_USER || 'root' }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_SSH_KNOWN_HOSTS: ${{ secrets.REMOTE_SSH_KNOWN_HOSTS }}
          REMOTE_PASS: ${{ secrets.REMOTE_PASS }}
          PROMLIFECYCLE_ADMIN_PASSWORD: ${{ secrets.PROMLIFECYCLE_ADMIN_PASSWORD }}
        run: |
          if [ -n "$REMOTE_HOST" ] && [ -n "$REMOTE_PASS" ]; then
            if [ -z "$REMOTE_SSH_KNOWN_HOSTS" ]; then
              echo "ERROR: configure verified REMOTE_SSH_KNOWN_HOSTS for the test host" >&2
              exit 2
            fi
            sudo apt-get update
            sudo apt-get install -y sshpass openssh-client
            umask 077
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "$REMOTE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          fi
          make test-remote
